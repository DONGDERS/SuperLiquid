name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # The runner image already ships a Gradle that satisfies AGP 9.x; asking
      # setup-gradle for a literal "9.0" is rejected ("version 9.0 does not
      # exist"). Caching is all we need from the action.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The ubuntu runner image already ships the Android SDK. Running
      # android-actions/setup-android on this image fails with
      # "Failed to find package 'tools'" (it still asks sdkmanager for the
      # long-removed "tools" package), which aborted the job before any
      # compilation happened.
      - name: Locate Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-$ANDROID_SDK_ROOT}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${ANDROID_HOME:-$ANDROID_SDK_ROOT}" >> "$GITHUB_ENV"

      - name: Report environment
        run: |
          java -version
          gradle --version
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true

      - name: Assemble debug
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: warn

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            app/build/reports/**
            **/build/outputs/logs/**
          if-no-files-found: warn
